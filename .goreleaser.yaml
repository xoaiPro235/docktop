version: 2

project_name: docktop

before:
  hooks:
    - go mod tidy

builds:
  - id: docktop
    main: ./cmd/docktop
    binary: docktop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

nfpms:
  - id: packages
    package_name: docktop
    vendor: xoaiPro235
    homepage: https://github.com/xoaiPro235/docktop
    maintainer: xoaiPro235
    description: "A fast, modern terminal UI for managing Docker."
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    ## 🚀 Welcome to docktop {{ .Tag }}!

    > [!NOTE]
    > If you encounter any issues, please report them on [GitHub Issues](https://github.com/xoaiPro235/docktop/issues)! Feedback is warmly welcomed ❤️

  footer: |
    ---
    ### ❤️ Contributors
    Thank you to all contributors for helping make this release possible!

    **Full Changelog**: [`{{ .PreviousTag }}...{{ .Tag }}`](https://github.com/xoaiPro235/docktop/compare/{{ .PreviousTag }}...{{ .Tag }})

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }}{{ if .Logins }} (by {{ .Logins | englishJoin }}){{ end }}"
  filters:
    exclude:
      - "(?i)^docs:"
      - "(?i)^test:"
      - "(?i)^chore:"
      - "(?i)^ci:"
  groups:
    - title: "✨ Features"
      regexp: '(?i)^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: "🐛 Bug fixes"
      regexp: '(?i)^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: "⚡ Performance"
      regexp: '(?i)^.*?perf(\(.+\))?!?:.+$'
      order: 2
    - title: "♻️ Refactors"
      regexp: '(?i)^.*?refactor(\(.+\))?!?:.+$'
      order: 3
    - title: "📝 Documentation"
      regexp: '(?i)^.*?docs?(\(.+\))?!?:.+$'
      order: 4
      
homebrew_casks:
  - name: docktop
    ids:
      - default
    binaries:
      - docktop
    homepage: "https://github.com/xoaiPro235/docktop"
    description: "A fast, modern terminal UI for managing Docker."
    directory: Casks
    repository:
      owner: xoaiPro235
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: xoaiPro235
      email: "maivanluc.it@gmail.com"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/docktop"]
          end

scoops:
  - name: docktop
    ids:
      - default
    homepage: "https://github.com/xoaiPro235/docktop"
    description: "A fast, modern terminal UI for managing Docker."
    license: MIT
    repository:
      owner: xoaiPro235
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: xoaiPro235
      email: "maivanluc.it@gmail.com"

winget:
  - name: docktop
    publisher: xoaiPro235
    package_identifier: xoaiPro235.docktop
    publisher_url: "https://github.com/xoaiPro235"
    publisher_support_url: "https://github.com/xoaiPro235/docktop/issues"
    short_description: "A fast, modern terminal UI for managing Docker."
    license: MIT
    license_url: "https://github.com/xoaiPro235/docktop/blob/main/LICENSE"
    homepage: "https://github.com/xoaiPro235/docktop"
    release_notes: "{{ .Changelog }}"
    tags:
      - docker
      - tui
      - cli
      - golang
    ids:
      - default
    repository:
      owner: xoaiPro235
      name: winget-pkgs
      branch: "docktop-{{ .Version }}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: xoaiPro235
      email: "maivanluc.it@gmail.com"